name: build-desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Быстрый гейт качества перед сборками: анализатор + юнит-тесты (генератор конфига туннеля
  # и разбор подписки). Платформенные каркасы для этого не нужны — только pub get.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # infos не роняют релиз — блокируют только настоящие ошибки компиляции/анализа
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter config --enable-windows-desktop
      - run: flutter create --org com.bitapsvpn --platforms=windows,android --project-name bitaps_vpn .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release --dart-define=BUILD_NUMBER=${{ github.run_number }}
      # VPN-движок кладём РЯДОМ с исполняемым файлом: приложение ищет его там (desktop_engine.dart).
      # Версия и контрольная сумма закреплены (см. pkg/THIRD-PARTY.md) — молча подменённый бинарь
      # движка означал бы чужой код в туннеле пользователя.
      - name: VPN-движок (xray) в сборку
        shell: pwsh
        run: |
          $ver = "v26.3.27"
          $sha = "d004c39288ce9ada487c6f398c7c545f7d749e44bdfdd59dbc9f865afba4e1ad"
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/download/$ver/Xray-windows-64.zip" -OutFile xray.zip
          $got = (Get-FileHash xray.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "xray checksum mismatch: $got" }
          Expand-Archive xray.zip -DestinationPath xray-tmp -Force
          Copy-Item xray-tmp\xray.exe build\windows\x64\runner\Release\xray.exe
          Copy-Item pkg\THIRD-PARTY.md build\windows\x64\runner\Release\THIRD-PARTY.md
          if (-not (Test-Path build\windows\x64\runner\Release\xray.exe)) { throw "xray.exe not packaged" }
      - name: Portable zip
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath bitaps-windows-x64.zip -Force
      - name: Installer (Inno Setup)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" pkg\installer.iss'
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          files: |
            bitaps-setup.exe
            bitaps-windows-x64.zip

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deps
        # libayatana-appindicator3-dev — для tray_manager (иконка в трее); без него linux-сборка падает
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libfuse2 libsecret-1-dev libayatana-appindicator3-dev libkeybinder-3.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter config --enable-linux-desktop
      - run: flutter create --org com.bitapsvpn --platforms=linux --project-name bitaps_vpn .
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=BUILD_NUMBER=${{ github.run_number }}
      # тот же движок для Linux: в bundle → попадает и в tar.gz, и в AppImage
      - name: VPN-движок (xray) в сборку
        run: |
          ver=v26.3.27
          sha=23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
          curl -sSL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/$ver/Xray-linux-64.zip"
          echo "$sha  xray.zip" | sha256sum -c -
          unzip -o -q xray.zip -d xray-tmp
          install -m 0755 xray-tmp/xray build/linux/x64/release/bundle/xray
          cp pkg/THIRD-PARTY.md build/linux/x64/release/bundle/THIRD-PARTY.md
          build/linux/x64/release/bundle/xray version | head -1
      - name: Portable tar.gz
        run: tar -czf bitaps-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - name: AppImage
        run: bash pkg/build-appimage.sh
      - name: build_number.txt (для авто-проверки обновлений в приложении)
        run: echo "${{ github.run_number }}" > build_number.txt
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          files: |
            bitaps-x86_64.AppImage
            bitaps-linux-x64.tar.gz
            build_number.txt

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter create --org com.bitapsvpn --platforms=android --project-name bitaps_vpn .
      - name: Patch Android manifest (INTERNET, allowBackup=false) + minSdk 24
        run: |
          perl -0pi -e 's/(<manifest\b[^>]*>)/$1\n    <uses-permission android:name="android.permission.INTERNET"\/>/' android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml && echo "INTERNET ok" || (echo "INTERNET MISSING" && exit 1)
          # allowBackup=false: не бэкапить локальную сессию/секреты приложения (flutter_secure_storage + plaintext-фолбэк) через adb/облачный backup
          perl -0pi -e 's/(<application\b)/$1 android:allowBackup="false"/ unless /android:allowBackup/' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml && echo "allowBackup ok" || (echo "allowBackup MISSING" && exit 1)
          sed -i.bak 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i.bak 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle 2>/dev/null || true
      - name: Patch Android manifest (deep-link bitaps:// + Quick Settings Tile)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # deep-link intent-filter внутри <activity> MainActivity: схема bitaps:// (import/login)
          perl -0pi -e 's#(</activity>)#            <intent-filter android:autoVerify="false">\n                <action android:name="android.intent.action.VIEW"/>\n                <category android:name="android.intent.category.DEFAULT"/>\n                <category android:name="android.intent.category.BROWSABLE"/>\n                <data android:scheme="bitaps"/>\n            </intent-filter>\n        $1#' $MANIFEST
          grep -q 'android:scheme="bitaps"' $MANIFEST && echo "deep-link ok" || (echo "deep-link MISSING" && exit 1)
          # Quick Settings Tile: сервис-плитка «bitaps VPN» в шторке (открывает приложение)
          perl -0pi -e 's#(</application>)#        <service\n            android:name=".BitapsTileService"\n            android:exported="true"\n            android:icon="\@mipmap/ic_launcher"\n            android:label="bitaps VPN"\n            android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">\n            <intent-filter>\n                <action android:name="android.service.quicksettings.action.QS_TILE"/>\n            </intent-filter>\n        </service>\n    $1#' $MANIFEST
          grep -q 'BitapsTileService' $MANIFEST && echo "QS tile ok" || (echo "QS tile MISSING" && exit 1)
          # Kotlin TileService: кладём рядом с MainActivity (пакет резолвим по каталогу MainActivity).
          # Тело кладём из base64 — heredoc в YAML block-scalar ломается на отступах терминатора.
          MAIN=$(find android/app/src/main/kotlin -name MainActivity.kt | head -1)
          if [ -z "$MAIN" ]; then echo "MainActivity.kt not found" && exit 1; fi
          PKG=$(grep -m1 '^package ' "$MAIN" | sed 's/package //; s/[[:space:]]*$//')
          DIR=$(dirname "$MAIN")
          printf 'package %s\n' "$PKG" > "$DIR/BitapsTileService.kt"
          # base64-строкой (одна строка → без heredoc, безопасно для YAML block-scalar отступов)
          B64=''
          echo "$B64" | base64 -d >> "$DIR/BitapsTileService.kt"
          echo "TileService written to $DIR (package $PKG)"
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: yes | flutter doctor --android-licenses || true
      - run: flutter build apk --release --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk bitaps.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          files: bitaps.apk

# ─────────────────────────────────────────────────────────────────────────────
# macOS-джоба НАМЕРЕННО не добавлена. Почему (чтобы не сломать рабочий CI):
#   • Папка macos/ (как и windows/linux/android) в .gitignore и восстанавливается через
#     `flutter create --platforms=macos .`. Но локальная macos/ несёт кастомную нативную
#     сторону туннеля (PacketTunnelProvider/entitlements), которой НЕТ в репозитории —
#     `flutter create` сгенерил бы ванильный каркас БЕЗ неё. То есть Apple-путь (нативный
#     туннель) такой сборкой всё равно не проверился бы, только пустой демо-каркас.
#   • `flutter create` здесь — деструктивный шаг (перегенерация каркаса); трогать его без
#     полной уверенности запрещено.
#   • По принятому пайплайну (см. заметку «bitaps release pipeline») macOS собирается ВРУЧНУЮ
#     (dmg + подпись через API), а не в этом workflow.
# Если когда-нибудь понадобится CI-проверка ванильной macOS-сборки без подписи — добавить
# отдельную джобу на `runs-on: macos-latest`:
#   flutter config --enable-macos-desktop
#   flutter create --org com.bitapsvpn --platforms=macos --project-name bitaps_vpn .
#   flutter pub get && flutter build macos --release
# — предварительно проверив, что перегенерация каркаса не затрёт нужную нативную сторону.
# ─────────────────────────────────────────────────────────────────────────────
